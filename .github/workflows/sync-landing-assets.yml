name: Sync landing page assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download landing page assets
        run: |
          set -euo pipefail
          mkdir -p public/landing-pages/inner-green-assets
          curl -fL --retry 3 'https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ecostove.jpg' -o public/landing-pages/inner-green-assets/card-ecostove.jpg
          curl -fL --retry 3 'https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/c74a626e396794aa239bca6f/card-ethos.jpg' -o public/landing-pages/inner-green-assets/card-ethos.jpg
          curl -fL --retry 3 'https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/embedded/1ec8f6ee2750554b4bc59ff0b507d316a82a7ba37e0e5bebc41d3bd9b9faad46.woff2' -o public/landing-pages/inner-green-assets/lexend-latin.woff2
          file public/landing-pages/inner-green-assets/*
      - name: Commit downloaded assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/landing-pages/inner-green-assets/card-ecostove.jpg public/landing-pages/inner-green-assets/card-ethos.jpg public/landing-pages/inner-green-assets/lexend-latin.woff2
          if git diff --cached --quiet; then
            echo 'Assets already present and unchanged.'
            exit 0
          fi
          git commit -m 'Add missing landing page assets'
          git push origin HEAD:main
