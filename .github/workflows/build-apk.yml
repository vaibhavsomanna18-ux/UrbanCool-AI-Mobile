name: Build UrbanCool AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure circular globe launcher icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/drawable/ic_urbancool_globe.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#07161b" android:pathData="M54,10A44,44 0,1 0,54 98A44,44 0,1 0,54 10"/>
            <path android:fillColor="#0b4b59" android:pathData="M54,13A41,41 0,1 0,54 95A41,41 0,1 0,54 13"/>
            <path android:fillColor="#159a91" android:pathData="M54,16A38,38 0,1 0,54 92A38,38 0,1 0,54 16"/>
            <path android:fillColor="#45d6b1" android:pathData="M39,29L47,23L56,26L64,22L72,29L67,35L59,34L53,42L45,39L40,46L32,41L35,34Z"/>
            <path android:fillColor="#35b779" android:pathData="M65,48L76,46L82,53L77,60L69,58L64,65L57,61L61,54Z"/>
            <path android:fillColor="#55c987" android:pathData="M44,61L52,66L49,75L42,82L36,74L39,66Z"/>
            <path android:fillColor="#083c4b" android:pathData="M18,57C30,49 40,47 51,51C64,56 75,54 91,47L91,65C77,73 67,76 52,72C39,69 28,73 17,79Z"/>
            <path android:fillColor="#062d3a" android:pathData="M20,77C35,68 48,74 59,80C69,85 79,81 87,76C81,88 69,94 54,94C39,94 26,87 20,77Z"/>
            <path android:strokeColor="#b9fff3" android:strokeWidth="1.2" android:fillColor="@android:color/transparent" android:pathData="M54,16A38,38 0,1 0,54 92A38,38 0,1 0,54 16"/>
            <path android:strokeColor="#9df3e8" android:strokeWidth="1" android:fillColor="@android:color/transparent" android:pathData="M16,54L92,54M54,16C39,27 39,81 54,92M54,16C69,27 69,81 54,92"/>
            <path android:fillColor="#dffff9" android:pathData="M36,27C42,22 48,19 54,18C47,23 43,29 40,37C37,45 35,55 36,64C31,54 30,41 36,27Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_urbancool_globe"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_urbancool_globe"/>
          </adaptive-icon>
          EOF
          if grep -q 'android:icon=' android/app/src/main/AndroidManifest.xml; then
            sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          fi
          if grep -q 'android:roundIcon=' android/app/src/main/AndroidManifest.xml; then
            sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher_round"#' android/app/src/main/AndroidManifest.xml
          else
            sed -i 's#<application #<application android:roundIcon="@mipmap/ic_launcher_round" #' android/app/src/main/AndroidManifest.xml
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify bundled app entrypoint
        shell: bash
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/theme.css
          echo "Bundled UrbanCool frontend verified"
          wc -c www/index.html www/app.js www/theme.css

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UrbanCool-AI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
